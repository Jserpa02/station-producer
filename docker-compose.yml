services:

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-weatherdb}
      POSTGRES_USER:     ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weatherdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Producer ────────────────────────────────────────────────────────────────
  producer:
    build: ./producer
    container_name: producer
    restart: always
    environment:
      RABBITMQ_URL:      amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      STATION_IDS:       ${STATION_IDS:-ST-001,ST-002,ST-003}
      INTERVAL_SECONDS:  ${INTERVAL_SECONDS:-5.0}
      RANDOM_SEED:       ${RANDOM_SEED:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ── Consumer ────────────────────────────────────────────────────────────────
  consumer:
    build: ./consumer
    container_name: consumer
    restart: always
    environment:
      RABBITMQ_URL:      amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-weatherdb}
      POSTGRES_USER:     ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather123}
      RETRY_DELAY:       5.0
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  api:
      build: ./api
      container_name: api
      restart: always
      environment:
        POSTGRES_HOST:     postgres
        POSTGRES_PORT:     5432
        POSTGRES_DB:       ${POSTGRES_DB:-weatherdb}
        POSTGRES_USER:     ${POSTGRES_USER:-weather}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather123}
      ports:
        - "8000:8000"
      depends_on:
        postgres:
          condition: service_healthy
volumes:
  rabbitmq_data:
  postgres_data:
